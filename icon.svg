<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="nn-paper" x1="3" y1="7" x2="15" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BF5"/>
      <stop offset="1" stop-color="#3D5BD9"/>
    </linearGradient>
    <linearGradient id="nn-fire" x1="17" y1="2" x2="17" y2="12.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB13D"/>
      <stop offset="1" stop-color="#F5484D"/>
    </linearGradient>
  </defs>
  <!-- folded newspaper -->
  <rect x="2.5" y="6.5" width="13" height="14" rx="2.2" fill="url(#nn-paper)"/>
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".92">
    <path d="M5 10.2h4.6"/>
    <path d="M5 13.2h8"/>
    <path d="M5 16.2h5.6"/>
  </g>
  <!-- hot flame, white ring keeps it readable on light and dark sidebars -->
  <path d="M17.3 2.2c2 2.1 3.5 3.9 3.5 5.8a3.5 3.5 0 0 1-7 0c0-1.1.4-2.3 1.2-3.5.3.6.9 1.1 1.5 1.2.2-1.3.4-2.4.8-3.5Z"
        fill="url(#nn-fire)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
